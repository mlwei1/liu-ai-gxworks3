<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#f8fafc"/>
  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1a202c">gx3gen — Agent-first PLC generation pipeline</text>

  <rect x="20" y="60" width="170" height="80" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="105" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3748">User</text>
  <text x="105" y="108" text-anchor="middle" font-size="11" fill="#4a5568">requirement + IO list</text>
  <text x="105" y="124" text-anchor="middle" font-size="11" fill="#4a5568">+ own programs (style)</text>

  <rect x="225" y="60" width="190" height="80" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="320" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">AI agent / LLM</text>
  <text x="320" y="108" text-anchor="middle" font-size="11" fill="#1e40af">writes ProgramSpec (JSON)</text>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#1e40af">via MCP tools</text>

  <rect x="450" y="60" width="150" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="525" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Quality gate</text>
  <text x="525" y="108" text-anchor="middle" font-size="11" fill="#92400e">empty steps / loop /</text>
  <text x="525" y="124" text-anchor="middle" font-size="11" fill="#92400e">timers / start-stop</text>

  <rect x="635" y="60" width="175" height="80" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="722" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Deterministic compiler</text>
  <text x="722" y="108" text-anchor="middle" font-size="11" fill="#166534">GX program CSV + comments</text>
  <text x="722" y="124" text-anchor="middle" font-size="11" fill="#166534">+ network table + report</text>

  <rect x="20" y="190" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="105" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3748">Engineer</text>
  <text x="105" y="235" text-anchor="middle" font-size="11" fill="#4a5568">reviews / edits</text>

  <rect x="225" y="190" width="190" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="320" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3748">GX Works3 (FX5U)</text>
  <text x="320" y="235" text-anchor="middle" font-size="11" fill="#4a5568">import CSV → Convert All</text>

  <rect x="450" y="190" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="525" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3748">Feedback</text>
  <text x="525" y="235" text-anchor="middle" font-size="11" fill="#4a5568">corrections → lessons</text>

  <rect x="635" y="190" width="175" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="722" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3748">Style profile</text>
  <text x="722" y="235" text-anchor="middle" font-size="11" fill="#4a5568">learned from user programs</text>

  <line x1="190" y1="100" x2="220" y2="100" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="100" x2="445" y2="100" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="100" x2="630" y2="100" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M722,145 L722,160 L320,160 L320,185" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="225" x2="445" y2="225" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600,225 L600,245 L190,245 L190,135" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M722,190 L722,150" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="490" y="280" text-anchor="middle" font-size="11" fill="#64748b">Agent-first · deterministic rendering · quality-gated · human-in-the-loop</text>
</svg>
